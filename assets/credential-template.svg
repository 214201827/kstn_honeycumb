<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plantilla de tarjeta CR80 (85.60 x 53.98 mm) — Honeycumb
  Archivo de ejemplo: assets/credential-template.svg
  Reemplaza logo.png, photo.jpg y qr.png por assets reales antes de exportar a PDF.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="85.60mm" height="53.98mm" viewBox="0 0 856 539" version="1.1">
  <defs>
    <style type="text/css"><![CDATA[
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 22px; }
      .bg-accent { fill: #0ea5a4; }
      .institution { font-family: 'Inter', 'Roboto', sans-serif; font-weight: 700; font-size: 30px; fill: #0f172a; }
      .small { font-family: 'Inter', 'Roboto', sans-serif; font-size: 14px; fill: #374151; }
      .name { font-family: 'Inter', 'Roboto', sans-serif; font-weight: 600; font-size: 22px; fill: #111827; }
      .meta { font-family: 'Inter', 'Roboto', sans-serif; font-size: 14px; fill: #6b7280; }
      .id { font-family: 'Inter', 'Roboto', sans-serif; font-size: 12px; fill: #6b7280; }
      .photo-frame { fill: #f3f4f6; stroke: #e5e7eb; }
    ]]></style>
  </defs>

  <!-- Card background with rounded corners -->
  <rect class="card" x="2" y="2" width="852" height="535" rx="22" ry="22"/>

  <!-- Accent stripe -->
  <rect class="bg-accent" x="0" y="0" width="160" height="535" rx="22" ry="22"/>

  <!-- Logo placeholder (replace with institution logo) -->
  <rect x="24" y="18" width="120" height="40" fill="transparent" />
  <text x="24" y="48" class="small" fill="#ffffff">LOGO</text>

  <!-- Photo area -->
  <rect class="photo-frame" x="24" y="80" width="240" height="300" rx="8" ry="8"/>
  <image href="photo.jpg" x="34" y="90" width="220" height="280" preserveAspectRatio="xMidYMid slice" />

  <!-- Student data -->
  <text x="300" y="120" class="institution">Nombre Institución</text>
  <text x="300" y="160" class="name">Nombre Completo del Estudiante</text>
  <text x="300" y="190" class="meta">Curso / Grado: 5º A</text>
  <text x="300" y="215" class="meta">Sección: Matutina</text>

  <!-- Credential number and dates -->
  <text x="300" y="260" class="id">ID Interno: 123e4567-e89b-12d3-a456-426614174000</text>
  <text x="300" y="285" class="id">Credencial: YY12345</text>
  <text x="300" y="310" class="id">Emisión: 2025-10-27  •  Expira: 2026-10-27</text>

  <!-- QR placeholder (replace with generated qr.png) -->
  <rect x="640" y="330" width="160" height="160" fill="#ffffff" stroke="#e5e7eb" rx="6"/>
  <image href="qr.png" x="648" y="338" width="144" height="144" preserveAspectRatio="xMidYMid meet" />

  <!-- Footer small text on reverse or bottom -->
  <text x="24" y="520" class="id">Contacto: info@honeycumb.edu  •  Tel: +51 1 234-5678</text>

  <!-- Cut/bleed marks (3mm bleed) -->
  <!-- These are guide marks for the print operator; they should be outside the final trim area -->
  <g stroke="#111827" stroke-width="1" opacity="0.4">
    <!-- Top-left -->
    <line x1="6" y1="6" x2="36" y2="6" />
    <line x1="6" y1="6" x2="6" y2="36" />
    <!-- Top-right -->
    <line x1="820" y1="6" x2="850" y2="6" />
    <line x1="850" y1="6" x2="850" y2="36" />
    <!-- Bottom-left -->
    <line x1="6" y1="533" x2="36" y2="533" />
    <line x1="6" y1="503" x2="6" y2="533" />
    <!-- Bottom-right -->
    <line x1="820" y1="533" x2="850" y2="533" />
    <line x1="850" y1="503" x2="850" y2="533" />
  </g>

</svg>
